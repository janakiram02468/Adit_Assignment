services:
  - type: web
    name: task-manager-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      # Set these in the Render dashboard (do not commit secrets):
      # - MONGODB_URI
      # - JWT_SECRET
      # - CLIENT_URLS (comma-separated, include your Vercel URL)
